<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit School Calender</title>
</head>
<body>
<form id="f1" method="post" >
    {% csrf_token %}
   <table class="table table-striped">
    {{ f.as_table }}
       <tr>
           <td>
                <input type="submit" value="submit">
           </td>
       </tr>

   </table></form>




<table class="table table-striped">
    <tr>
        <td>
          CalenderDate
        </td>
	<td>
          CalenderDay
        </td>
	<td>
          Working_day
        </td>
        <td colspan="2">
            Description
        </td>
    </tr>
    {% for obj in dataset %}
    <tr>
        <td>
           {{obj.CalenderDate}}
        </td>
	<td>
           {{obj.CalenderDay}}
        </td>
	<td>
           {{obj.Working_day}}
        </td>
        <td>
           {{obj.Description}}
        </td>

<td>
            <a href="{% url 'SchoolCalender_Edit' obj.id %}">Edit </a>
        </td>
           <td>
              <a href="{% url 'SchoolCalender_Delete' obj.id %}">Delete </a>
        </td>

    </tr>
    {% endfor %}
</table>

</body>
</html>
